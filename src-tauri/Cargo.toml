[package]
name = "src-tauri"
version = "0.1.0"
edition = "2024"
[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-utils = "2.0.0"
axum = "0.7"
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "sync"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio", "macros"] }

tower-http = { version = "0.5", features = ["trace", "fs", "cors"] }
tauri-plugin-fs = "2.6.0"
tauri-plugin-dialog = "2.8.1"
local-ip-address = "0.6"

[profile.release]
strip = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

